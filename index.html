let L = (navigator.language || 'en').slice(0, 2);
if (!T[L]) L = 'en';
const t = (k) => T[L][k];
let sk = 'idle';
function setStatus(k) { sk = k; $('status').textContent = k ? t(k) : ''; $('status').style.display = k ? 'flex' : 'none'; }
function applyLang() {
  document.documentElement.lang = L;
  document.documentElement.dir = (L === 'ar' || L === 'ur') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach((e) => { e.textContent = t(e.dataset.i); });
  $('msg').placeholder = t('ph');
  $('start').textContent = t((searching || pc) ? 'next' : 'start');
  setStatus(sk);
}


$('agree').onclick = () => { $('gate').remove(); };

function say(text, me) {
  const p = document.createElement('p');
  if (me) p.className = 'me';
  p.textContent = t(me ? 'you' : 'them') + ': ' + text;
  $('log').append(p); $('log').scrollTop = 1e9;
}
function ui(inChat) {
  $('stop').disabled = !searching && !inChat;
  $('report').disabled = !inChat; $('msg').disabled = !inChat; $('sendBtn').disabled = !inChat;
  $('start').textContent = t((searching || inChat) ? 'next' : 'start');
}
function closePC() {
  if (pc) { pc.onicecandidate = pc.ontrack = pc.onconnectionstatechange = null; pc.close(); pc = null; }
  $('remote').srcObject = null;
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

async function getCam() {
  if (stream) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    $('local').srcObject = stream; return true;
  } catch { setStatus('cam'); return false; }
}
function connectWS() {
  return new Promise((ok) => {
    if (ws && ws.readyState === 1) return ok();
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = ok;
    ws.onmessage = onMsg;
    ws.onclose = () => { searching = false; closePC(); ui(false); setStatus('idle'); };
  });
}
function makePC() {
  closePC();
  pc = new RTCPeerConnection(ICE);
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => { $('remote').srcObject = e.streams[0]; setStatus(''); };
  pc.onicecandidate = (e) => e.candidate && send({ t: 'ice', c: e.candidate });
  pc.onconnectionstatechange = () => { if (pc && pc.connectionState === 'failed') { closePC(); ui(false); setStatus('idle'); } };
}
async function onMsg(ev) {
  const m = JSON.parse(ev.data);
  if (m.t === 'match') {
    searching = false; $('log').textContent = ''; setStatus('conn'); ui(true);
    makePC();
    if (m.initiator) { const o = await pc.createOffer(); await pc.setLocalDescription(o); send({ t: 'offer', d: o }); }
  } else if (m.t === 'offer' && pc) {
    await pc.setRemoteDescription(m.d);
    const a = await pc.createAnswer(); await pc.setLocalDescription(a); send({ t: 'answer', d: a });
  } else if (m.t === 'answer' && pc) await pc.setRemoteDescription(m.d);
  else if (m.t === 'ice' && pc) { try { await pc.addIceCandidate(m.c); } catch {} }
  else if (m.t === 'chat') say(String(m.x).slice(0, 300), false);
  else if (m.t === 'left') { closePC(); ui(false); setStatus('left'); }
}

$('start').onclick = async () => {
  if (!(await getCam())) return;
  await connectWS();
  closePC(); searching = true; $('log').textContent = '';
  setStatus('find'); ui(false);
  send({ t: 'find' });
};
$('stop').onclick = () => { send({ t: 'stop' }); searching = false; closePC(); ui(false); setStatus('idle'); };
$('report').onclick = () => { send({ t: 'report' }); closePC(); ui(false); setStatus('left'); };
$('chatForm').onsubmit = (e) => {
  e.preventDefault();
  const x = $('msg').value.trim(); if (!x) return;
  send({ t: 'chat', x }); say(x, true); $('msg').value = '';
};
const sel = $('lang');
Object.keys(LN).forEach((k) => { const o = document.createElement('option'); o.value = k; o.textContent = LN[k]; sel.append(o); });
sel.value = L;
sel.onchange = () => { L = sel.value; applyLang(); };
applyLang();
</script>
